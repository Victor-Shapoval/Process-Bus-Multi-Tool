# Enables the GOOSE publication module.
enabled: false

# Network interface used to send GOOSE messages.
interface: eth0

# List of GOOSE publishers.
publishers:
    - name: PBMT_GOOSE
      dst_mac: 01:0c:cd:01:00:01
      src_mac: 00:11:22:33:44:55
      app_id: 0x0001
      gocb_ref: IED1/LLN0$GO$Control
      dat_set: IED1/LLN0$DataSet1
      go_id: CTRL1
      conf_rev: 1
      nds_com: false
      vlan_id: 1
      vlan_pri: 4
      min_interval_ms: 10
      max_interval_ms: 2000
      dataset:
        - {name: Signal1.stVal, type: bool}
        - {name: Signal1.q, type: quality}
        - {name: Signal2.stVal, type: bool}
        - {name: Signal2.q, type: quality}
