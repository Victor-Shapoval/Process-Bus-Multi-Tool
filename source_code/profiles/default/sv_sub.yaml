# Enables the Sampled Values reception module.
# false hides the module from the dashboard; true allows it to be started.
enabled: false

# Network interface used to receive SV traffic.
# In the GUI, this field is selected from the system interface list.
interface: eth0

# Promiscuous mode receives all Ethernet frames on the interface.
# true is usually convenient for Process Bus diagnostics and commissioning.
promiscuous: true

# List of SV streams to receive.
subscriptions:
  # Human-readable subscription name used in the GUI and logs.
  - name: IED_SV
    # Destination MAC of the SV multicast stream.
    dst_mac: 01:0c:cd:04:00:01
    # Source MAC of the publishing device.
    # Leave the field empty through the GUI when source filtering is unnecessary.
    src_mac:
    # VLAN ID of the incoming SV stream.
    # Leave the field empty through the GUI when VLAN filtering is unnecessary.
    vlan_id: 1
    # SV stream APPID. IEC 61850-9-2LE commonly uses the 0x4000 range.
    app_id: 0x4001
    # svID from the SV ASDU. It must match the publishing device.
    sv_id: PBMTMU0101
    # Samples per period for this SV stream.
    # Used for frequency calculation when smpRate is not transmitted in the packet.
    smp_rate: 80
    sample_timing_frequency: 50
    # Reference vector for displaying incoming SV phasors.
    # The reception format remains fixed at 9-2LE.
    base_vector: Ua
    # KI is the engineering coefficient for current values.
    # The default is 1, which displays values without additional scaling.
    current_coefficient: 1
    # KU is the engineering coefficient for voltage values.
    # The default is 1, which displays values without additional scaling.
    voltage_coefficient: 1
